name: Cleanup All Tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete old tags (keep latest 3)
        run: |
          echo "Fetching all tags..."
          git fetch --tags
          
          echo "Listing all tags:"
          git tag -l
          
          TAG_COUNT=$(git tag -l | wc -l)
          echo "Total tags found: $TAG_COUNT"
          
          if [ $TAG_COUNT -eq 0 ]; then
            echo "No tags found."
            exit 0
          fi
          
          if [ $TAG_COUNT -le 3 ]; then
            echo "Only $TAG_COUNT tags found, keeping all (threshold: 3)"
            exit 0
          fi
          
          echo "Getting tags sorted by creation date (newest first)..."
          TAGS_TO_DELETE=$(git tag --sort=-creatordate | tail -n +4)
          
          if [ -z "$TAGS_TO_DELETE" ]; then
            echo "No tags to delete."
            exit 0
          fi
          
          DELETE_COUNT=$(echo "$TAGS_TO_DELETE" | wc -l)
          echo "Tags to delete: $DELETE_COUNT"
          echo "$TAGS_TO_DELETE"
          
          echo "Deleting old tags..."
          echo "$TAGS_TO_DELETE" | xargs -n 1 git push --delete origin || true
          
          echo "Cleanup completed! Kept latest 3 tags, deleted $DELETE_COUNT old tags."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
