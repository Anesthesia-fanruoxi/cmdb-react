name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v0.0.0-dev"
          fi
          VERSION_NUM="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update version in files
        run: |
          sed -i.bak "s/VITE_APP_VERSION=.*/VITE_APP_VERSION=${{ steps.version.outputs.version }}/" .env || true
          sed -i.bak 's/^version = ".*"/version = "${{ steps.version.outputs.version_num }}"/' src-tauri/Cargo.toml
          sed -i.bak 's/"version": ".*"/"version": "${{ steps.version.outputs.version_num }}"/' src-tauri/tauri.conf.json
          sed -i.bak 's/"version": ".*"/"version": "${{ steps.version.outputs.version_num }}"/' package.json
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Prepare Windows artifacts
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p release
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.msi" -type f -exec cp {} "release/CMDB-Desktop-${{ matrix.name }}.msi" \;
        shell: bash

      - name: Prepare macOS artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p release
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" -type f -exec cp {} "release/CMDB-Desktop-${{ matrix.name }}.dmg" \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CMDB-Desktop-${{ matrix.name }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Delete old releases (keep latest 3)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          files: artifacts/*
          body: |
            ## 下载说明
            - Windows: 下载 `.msi` 文件安装
            - macOS Intel: 下载 `macos-intel.dmg` 安装
            - macOS ARM (M芯片): 下载 `macos-arm64.dmg` 安装
            
            ## macOS 安装提示
            由于应用未经 Apple 签名，首次打开可能提示"无法打开"或"文件已损坏"。
            请在终端执行以下命令解除限制：
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/CMDB\ Desktop.app
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
