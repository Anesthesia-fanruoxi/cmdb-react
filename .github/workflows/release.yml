name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v0.0.0-dev"
          fi
          VERSION_NUM="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update version in files
        run: |
          sed -i.bak "s/VITE_APP_VERSION=.*/VITE_APP_VERSION=${{ steps.version.outputs.version }}/" .env || true
          sed -i.bak 's/^version = ".*"/version = "${{ steps.version.outputs.version_num }}"/' src-tauri/Cargo.toml
          sed -i.bak 's/"version": ".*"/"version": "${{ steps.version.outputs.version_num }}"/' src-tauri/tauri.conf.json
          sed -i.bak 's/"version": ".*"/"version": "${{ steps.version.outputs.version_num }}"/' package.json
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # 只缓存依赖，不缓存构建产物（减少缓存大小）
          cache-targets: false
          # 使用更快的缓存 key
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Prepare Windows artifacts
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p release
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.msi" -type f -exec cp {} "release/CMDB-Desktop-${{ matrix.name }}.msi" \;
        shell: bash

      - name: Prepare macOS artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p release
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" -type f -exec cp {} "release/CMDB-Desktop-${{ matrix.name }}.dmg" \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CMDB-Desktop-${{ matrix.name }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Delete old releases (keep latest 3)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to server via HTTP
        run: |
          for file in artifacts/*; do
            echo "Uploading $file..."
            curl -X POST -F "file=@$file" https://api.hzbxhd.com/api/app/upload
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          files: artifacts/*
          body: |
            ## v1.0.5 更新说明
            - 修复更新后内容丢失问题
            ## v1.0.4 更新说明
            - 优化更新逻辑
            ## v1.0.3 更新说明
            - ES 搜索框修复
            ## v1.0.2更新说明
            - SQL 修复个人记录不显示问题
            - SQL 修复共享记录逻辑显示问题
            - SQL 查询执行时显示实时计时器
            ## v1.0.1更新说明
            - SQL 查询结果支持复制列数据
            - SQL 查询结果支持双击单元格复制值
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
