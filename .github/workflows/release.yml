name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Get version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $VERSION = "${{ github.ref_name }}"
          } else {
            $VERSION = "v0.0.0"
          }
          $VERSION_NUM = $VERSION -replace '^v', ''
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Update version
        run: |
          (Get-Content .env) -replace 'VITE_APP_VERSION=.*', "VITE_APP_VERSION=${{ steps.version.outputs.version }}" | Set-Content .env
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"${{ steps.version.outputs.version_num }}`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": ".*"', "`"version`": `"${{ steps.version.outputs.version_num }}`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content package.json) -replace '"version": ".*"', "`"version`": `"${{ steps.version.outputs.version_num }}`"" | Set-Content package.json
        shell: powershell

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Prepare artifacts
        run: |
          New-Item -ItemType Directory -Force -Path release
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.msi" | Copy-Item -Destination "release/CMDB-Desktop-windows-x64.msi"
        shell: powershell

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CMDB-Desktop-windows-x64
          path: release/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: macos-intel
          - target: aarch64-apple-darwin
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }}
      - run: |
          mkdir -p release
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" -type f -exec cp {} "release/CMDB-Desktop-${{ matrix.name }}.dmg" \;
      - uses: actions/upload-artifact@v4
        with:
          name: CMDB-Desktop-${{ matrix.name }}
          path: release/*

  release:
    needs: [build-windows]  # 加上 build-macos 当启用时
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to server
        run: |
          for file in artifacts/*; do
            echo "Uploading $file..."
            curl -X POST -F "file=@$file" https://api.hzbxhd.com/api/app/upload
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          files: artifacts/*
          body: |
            ## v1.0.5 更新说明
            - 修复更新后页面状态丢失问题
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
