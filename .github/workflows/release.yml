name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean old build
        run: |
          if (Test-Path "src-tauri\target") { Remove-Item -Recurse -Force "src-tauri\target" }
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
        shell: powershell

      - name: Get version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $VERSION = "${{ github.ref_name }}"
          } else {
            $VERSION = "v0.0.0"
          }
          $VERSION_NUM = $VERSION -replace '^v', ''
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Update version
        run: |
          (Get-Content .env) -replace 'VITE_APP_VERSION=.*', "VITE_APP_VERSION=${{ steps.version.outputs.version }}" | Set-Content .env
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"${{ steps.version.outputs.version_num }}`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": ".*"', "`"version`": `"${{ steps.version.outputs.version_num }}`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content package.json) -replace '"version": ".*"', "`"version`": `"${{ steps.version.outputs.version_num }}`"" | Set-Content package.json
        shell: powershell

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Prepare artifacts
        run: |
          New-Item -ItemType Directory -Force -Path release
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.msi" | Copy-Item -Destination "release/CMDB-Desktop-windows-x64.msi"
        shell: powershell

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CMDB-Desktop-windows-x64
          path: release/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: macos-intel
          - target: aarch64-apple-darwin
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.target }}

      - name: Install DMG tools
        run: |
          brew install create-dmg || true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v0.0.0"
          fi
          VERSION_NUM="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

      - name: Update version
        run: |
          sed -i '' "s/VITE_APP_VERSION=.*/VITE_APP_VERSION=${{ steps.version.outputs.version }}/" .env
          sed -i '' "s/^version = \".*\"/version = \"${{ steps.version.outputs.version_num }}\"/" src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.version_num }}\"/" src-tauri/tauri.conf.json
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.version_num }}\"/" package.json

      - run: npm ci
      - name: Build
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
      - run: |
          mkdir -p release
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" -type f -exec cp {} "release/CMDB-Desktop-${{ matrix.name }}.dmg" \;
      - uses: actions/upload-artifact@v4
        with:
          name: CMDB-Desktop-${{ matrix.name }}
          path: release/*

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to server
        run: |
          for file in artifacts/*; do
            echo "Uploading $file..."
            curl -X POST -F "file=@$file" https://api.hzbxhd.com/api/app/upload
          done

      - name: Update version to CMDB
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          DESCRIPTION="1、查询结果新增复制格式选择：右键可复制数据或复制 INSERT 语句，表名自动从执行 SQL 解析，解析不到时支持手动输入。
          2、修复复制 INSERT 在多结果集场景下表名解析失败的问题。
          3、修复跨库同名表字段补全串库：裸表名补全按当前选中库优先命中。
          4、表结构详情抽屉新增关闭动画。
          5、域名地图主域名下拉与新增表单展示域名归属方。
          6、cmdb-ui 网页版新增安全组管理功能（规则增删改、快捷添加、批量备注）。"

          DESCRIPTION_JSON=$(echo "$DESCRIPTION" | jq -Rs .)
          curl -X POST https://api.hzbxhd.com/api/app/version/update \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"$VERSION_NUM\", \"description\": $DESCRIPTION_JSON}"

      - name: Cleanup workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1