<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMDB Desktop</title>
    <style id="notify-preload-style">
      html, body, #root { background: transparent !important; }
    </style>
    <script id="notify-preload-script">
      (function () {
        var params = new URLSearchParams(location.search);
        var type = params.get('type') || '';

        // 通知窗：保持透明
        if (type === 'desktop-notify') {
          document.documentElement.style.background = 'transparent';
          return;
        }

        // 非通知窗：移除透明预加载样式
        document.getElementById('notify-preload-style').remove();

        // 尽早应用主题，消除白屏和主题闪烁
        // cmdb-theme 由 appStore.setTheme 每次切换时同步写入 localStorage
        var theme = 'light';
        try {
          theme = localStorage.getItem('cmdb-theme') || 'light';
        } catch (e) { /* 读取失败保持 light */ }

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.background = '#1a202c';
        } else {
          document.documentElement.style.background = '#e9ecef';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
