[package]
name = "cmdb-desktop"
version = "1.0.0"
description = "CMDB Desktop Application"
authors = ["Anesthesia"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.5", features = [] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-http = "2.2.0"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
machine-uid = "0.5"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
# 优化：精简时间库
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "5.0"
# 优化：精简系统信息库，仅保留必要功能
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 针对 GitHub Actions 冷启动优化的 Release 配置
[profile.release]
opt-level = 3
lto = "thin"          # 快速链接优化
codegen-units = 16    # 提高并行编译效率
strip = true          # 移除符号表，显著减小体积
panic = "abort"       # 减小二进制开销
incremental = true    # 开启增量支持（配合 Action 缓存）
